<script>
    function myMap() {
        var church = new google.maps.LatLng(45.027831,-93.445264);
        var crownePlaza = new google.maps.LatLng(45.016098, -93.452448);
        var mapProp= {
            center: {lat: 45.0221705, lng: -93.4494385},
            zoom:13,
            colorScheme: 'FOLLOW_SYSTEM'
        };
        var map = new google.maps.Map(document.getElementById("googleMap"), mapProp);
        var marker1 = new google.maps.Marker({position: church});
        marker1.setMap(map);
        var marker2 = new google.maps.Marker({position: crownePlaza});
        marker2.setMap(map);
    }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAvVio5UPSA8wPs5KPxlpi9_Adr9rg4jCE&callback=myMap"></script>
