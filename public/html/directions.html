<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/images/diamond-ring.svg">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="scripts.js"></script>
    <title>Jared & Tati</title>
</head>
<body style="width:90%">
    <div class="home-btn">
        <a href="/">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
            </svg>
        </a>
    </div>
    <div class="page-container">

        <header class="page-title">
            <h1 class="title">Directions</h1>
        </header>

        <div class="location-card">
            <p class="location-name">St. Joseph Historic Catholic Church</p>
            <div class="map-btn-row">
                <a href="https://maps.google.com/maps?q=St+Joeseph+Historic+Church,Plymouth,MN" target="_blank" class="map-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                    </svg>
                    Google Maps
                </a>
                <a href="https://maps.apple/p/20gNA~YJsw2d7m" target="_blank" class="map-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 16.016a7.5 7.5 0 0 0 1.962-14.74A1 1 0 0 0 9 0H7a1 1 0 0 0-.962 1.276A7.5 7.5 0 0 0 8 16.016zm6.5-7.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"/>
                        <path d="m6.94 7.44 4.95-2.83-2.83 4.95-4.949 2.83 2.828-4.95z"/>
                    </svg>
                    Apple Maps
                </a>
            </div>
        </div>

        <div class="location-card">
            <p class="location-name">Crowne Plaza Minneapolis West</p>
            <div class="map-btn-row">
                <a href="https://maps.google.com/maps?q=Crowne+Plaza,Plymouth,MN" target="_blank" class="map-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                    </svg>
                    Google Maps
                </a>
                <a href="https://maps.apple/p/91DuFQfuLsTyCr" target="_blank" class="map-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 16.016a7.5 7.5 0 0 0 1.962-14.74A1 1 0 0 0 9 0H7a1 1 0 0 0-.962 1.276A7.5 7.5 0 0 0 8 16.016zm6.5-7.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"/>
                        <path d="m6.94 7.44 4.95-2.83-2.83 4.95-4.949 2.83 2.828-4.95z"/>
                    </svg>
                    Apple Maps
                </a>
            </div>
        </div>

        <div id="googleMap"></div>

    </div>
</body>


<script>
    function myMap() {
        var church = new google.maps.LatLng(45.027831,-93.445264);
        var crownePlaza = new google.maps.LatLng(45.016098, -93.452448);
        var mapProp= {
            center: {lat: 45.0221705, lng: -93.4494385},
            zoom:13,
            colorScheme: 'FOLLOW_SYSTEM'
        };
        var map = new google.maps.Map(document.getElementById("googleMap"), mapProp);
        var marker1 = new google.maps.Marker({position: church});
        marker1.setMap(map);
        var marker2 = new google.maps.Marker({position: crownePlaza});
        marker2.setMap(map);
    }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAvVio5UPSA8wPs5KPxlpi9_Adr9rg4jCE&callback=myMap"></script>
