<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="../scripts.js"></script>
    <title>Tati & Jared</title>
</head>
<body>
    
    <div id="static-top">
        <a href="/" class="home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" stroke-width="10" class="bi bi-chevron-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
            </svg>
        </a>
        <p class="search-hint">Add your favorite songs to the queue!</p>
        <form id="music-search-form" action="javascript:musicSearch(musicsearch.value)">
            <div class="search-input-row">
                <div class="search-input-wrap">
                    <input type="text" id="musicsearch" name="musicsearch" placeholder="Song, artist, album..."
                        oninput="document.getElementById('musicsearch-clear').style.display = this.value ? 'flex' : 'none'">
                    <button type="button" id="musicsearch-clear" style="display:none;"
                        onclick="document.getElementById('musicsearch').value = ''; this.style.display = 'none'; document.getElementById('musicsearch').focus();">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                        </svg>
                    </button>
                </div>
                <button type="submit" class="search-btn">
                    <!-- spotify icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-spotify" viewBox="0 0 16 16">
                        <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288"/>
                    </svg>
                    &nbsp;Search
                    <!-- search icon -->
                    <!-- <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                    </svg> -->
                </button>
            </div>
        </form>
    </div>

    <div id="search-results-container">
        <table>
            <thead id="search-result-header" style="visibility: hidden;">
                <tr class="search-result">
                    <th></th>
                    <th>Track</th>
                </tr>
            </thead>
            <tbody id="search-results">
                <tr></tr>
            </tbody>
        </table>
    </div>

    <div id="queue-button" class="slide open" style="visibility: hidden;">
        <button id="add-to-queue-button" onclick="addToQueue()" disabled>Add to Queue</button>
    </div>
</body>
</html>
