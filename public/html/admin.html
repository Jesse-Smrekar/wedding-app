<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="scripts.js"></script>
    <script src="/scripts/admin.js"></script>
    <title>Tati & Jared</title>
</head>
<body>
    <div id="static-top">
        <p class="search-hint">Admin Controls</p>
        <div class="admin-action-row">
            <a href="/admin/spotify/login" class="admin-action-btn">Re-auth Spotify</a>
            <button class="admin-action-btn admin-danger-btn" onclick="purgeUsers()">Purge Users</button>
        </div>
    </div>

    <div id="admin-content">
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Next Queue Time</th>
                </tr>
            </thead>
            <tbody id="user-results">
                <tr></tr>
            </tbody>
        </table>
    </div>

    <div id="delete-button">
        <button id="delete-selected-button" onclick="deleteSelectedUsers()" disabled>Delete Selected</button>
    </div>
</body>
</html>
