<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/images/diamond-ring.svg">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="scripts.js"></script>
    <script src="/scripts/admin.js"></script>
    <title>Jared & Tati</title>
</head>
<body>
    <a href="/" class="home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
        </svg>
    </a>

    <div id="static-top" style="padding-top:80px">
        <div class="admin-action-row">
            <button class="btn btn-danger admin-action-btn" onclick="purgeUsers()">Purge Users</button>
        </div>
    </div>

    <div id="admin-content">
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Next Queue Time</th>
                </tr>
            </thead>
            <tbody id="user-results">
                <tr></tr>
            </tbody>
        </table>
    </div>

    <div id="delete-button">
        <button id="delete-selected-button" class="btn btn-block btn-danger" onclick="deleteSelectedUsers()" disabled>Delete Selected</button>
    </div>
</body>
</html>
