<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/images/diamond-ring.svg">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="scripts.js"></script>
    <script src="/scripts/admin.js"></script>
    <title>Jared & Tati</title>
</head>
<body>
    <a href="/" class="home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
            <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
        </svg>
    </a>
    <div id="static-top">
        <p class="search-hint">Admin Controls</p>
        <div class="admin-action-row">
            <a href="/admin/spotify/login" class="btn admin-action-btn">Re-auth Spotify</a>
            <button class="btn btn-danger admin-action-btn" onclick="purgeUsers()">Purge Users</button>
            <button class="btn admin-action-btn" onclick="toggleMusicQueue()">🎵 Limit</button>
        </div>
    </div>

    <div id="admin-content">
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Next Queue Time</th>
                </tr>
            </thead>
            <tbody id="user-results">
                <tr></tr>
            </tbody>
        </table>
    </div>

    <div id="delete-button">
        <button id="delete-selected-button" class="btn btn-block btn-danger" onclick="deleteSelectedUsers()" disabled>Delete Selected</button>
    </div>
</body>
</html>
