<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/images/diamond-ring.svg">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="scripts.js"></script>
    <title>Jared & Tati</title>
    <style>
        /* ── Two-page snap scroll (home page only) ── */
        #home-snap-container {
            height: 100vh;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            /* Keep scroll/snap behavior but hide the scrollbar chrome */
            scrollbar-width: none;          /* Firefox */
            -ms-overflow-style: none;       /* legacy Edge/IE */
        }
        #home-snap-container::-webkit-scrollbar {
            display: none;                  /* Chrome, Safari, modern Edge */
        }
        #snap-page-1 {
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        /* extends .btn — full width with spacing below */
        .slideshow-gallery-btn {
            width: 100%;
            margin-bottom: 14px;
        }
        #photo-slideshow {
            min-height: 100vh;
            min-height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            margin-bottom: 0;
            padding-top: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div id="home-snap-container">

    <!-- PAGE 1: nav grid -->
    <div id="snap-page-1">
        <header class="centered">
            <h1 class="jared-and-tati">Jared & Tati</h1>
        </header>

        <div class="centered">
            <div id="home-grid">

                <!-- MUSIC -->
                <button class="home-card" onclick="makeAuthenticatedRequest('GET', '/music');">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M6 13c0 1.105-1.12 2-2.5 2S1 14.105 1 13s1.12-2 2.5-2 2.5.896 2.5 2m9-2c0 1.105-1.12 2-2.5 2s-2.5-.895-2.5-2 1.12-2 2.5-2 2.5.895 2.5 2"/>
                        <path fill-rule="evenodd" d="M14 11V2h1v9zM6 3v10H5V3z"/>
                        <path d="M5 2.905a1 1 0 0 1 .9-.995l8-.8a1 1 0 0 1 1.1.995V3L5 4z"/>
                    </svg>
                    <span>Music</span>
                </button>

                <!-- ITINERARY -->
                <a class="home-card" href="/itinerary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 512 512">
                        <path d="M64 112c-8.8 0-16 7.2-16 16l0 256c0 8.8 7.2 16 16 16l384 0c8.8 0 16-7.2 16-16l0-256c0-8.8-7.2-16-16-16L64 112zM0 128C0 92.7 28.7 64 64 64l384 0c35.3 0 64 28.7 64 64l0 256c0 35.3-28.7 64-64 64L64 448c-35.3 0-64-28.7-64-64L0 128zM160 320a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zm-32-96a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm104-56l160 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-160 0c-13.3 0-24-10.7-24-24s10.7-24 24-24zm0 128l160 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-160 0c-13.3 0-24-10.7-24-24s10.7-24 24-24z"/>
                    </svg>
                    <span>Itinerary</span>
                </a>

                <!-- PHOTOS -->
                <button class="home-card" onclick="makeAuthenticatedRequest('GET', '/photos');">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 512 512">
                        <path d="M193.1 32c-18.7 0-36.2 9.4-46.6 24.9L120.5 96 64 96C28.7 96 0 124.7 0 160L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-256c0-35.3-28.7-64-64-64l-56.5 0-26-39.1C355.1 41.4 337.6 32 318.9 32L193.1 32zm-6.7 51.6c1.5-2.2 4-3.6 6.7-3.6l125.7 0c2.7 0 5.2 1.3 6.7 3.6l33.2 49.8c4.5 6.7 11.9 10.7 20 10.7l69.3 0c8.8 0 16 7.2 16 16l0 256c0 8.8-7.2 16-16 16L64 432c-8.8 0-16-7.2-16-16l0-256c0-8.8 7.2-16 16-16l69.3 0c8 0 15.5-4 20-10.7l33.2-49.8zM256 384a112 112 0 1 0 0-224 112 112 0 1 0 0 224zM192 272a64 64 0 1 1 128 0 64 64 0 1 1 -128 0z"/>
                    </svg>
                    <span>Photos</span>
                </button>

                <!-- DIRECTIONS -->
                <a class="home-card" href="/directions">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 512 512">
                        <path d="M256.4 0c-17.7 0-32 14.3-32 32l0 32-160 0c-17.7 0-32 14.3-32 32l0 64c0 17.7 14.3 32 32 32l160 0 0 64-153.4 0c-4.2 0-8.3 1.7-11.3 4.7l-48 48c-6.2 6.2-6.2 16.4 0 22.6l48 48c3 3 7.1 4.7 11.3 4.7l153.4 0 0 96c0 17.7 14.3 32 32 32s32-14.3 32-32l0-96 160 0c17.7 0 32-14.3 32-32l0-64c0-17.7-14.3-32-32-32l-160 0 0-64 153.4 0c4.2 0 8.3-1.7 11.3-4.7l48-48c6.2-6.2 6.2-16.4 0-22.6l-48-48c-3-3-7.1-4.7-11.3-4.7l-153.4 0 0-32c0-17.7-14.3-32-32-32z"/>
                    </svg>
                    <span>Directions</span>
                </a>

            </div>

            <p class="instructional-text">
                Swipe to see guest photos
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-down-short" viewBox="0 -10     24 24">
                    <path fill-rule="evenodd" d="M8 4a.5.5 0 0 1 .5.5v5.793l2.146-2.147a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 1 1 .708-.708L7.5 10.293V4.5A.5.5 0 0 1 8 4"/>
                </svg>
            </p>
        </div>
        
    </div>

    <!-- PAGE 2: guest photo slideshow (hidden until photos load) -->
    <section id="photo-slideshow" style="display:none;">
        <button class="btn slideshow-gallery-btn" onclick="makeAuthenticatedRequest('GET', '/photos/gallery');">Full Photo Gallery</button>
        <div class="slideshow-track-wrap">
            <div class="slideshow-track" id="slideshow-track"></div>
        </div>
        <div class="slideshow-dots" id="slideshow-dots"></div>
        <p class="slideshow-caption" id="slideshow-caption"></p>
    </section>

</div>

<script src="/scripts/slideshow.js"></script>

</body>
</html>
