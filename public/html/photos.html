<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="../scripts.js"></script>
    <script src="/scripts/photos.js"></script>
    <title>Tati & Jared</title>
</head>
<body>

    <a href="/" class="home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
            <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
        </svg>
    </a>

    <div id="photos-page">

        <header class="photos-header">
            <h1 class="title">Photos</h1>
        </header>

        <p class="page-intro">Share your favorite moments from the big day!</p>

        <!-- Hidden file input -->
        <input
            type="file"
            id="photo-input"
            accept=".jpg,.jpeg,.png,.heic,.heif,.raw,.arw,.cr2,.nef,.orf,.rw2,.sr2"
            multiple
            style="display:none;"
        >

        <!-- Drop / tap area -->
        <div class="upload-area" id="upload-area" onclick="document.getElementById('photo-input').click()">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" viewBox="0 0 16 16" style="color: var(--text-muted);">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
            </svg>
            <span class="upload-area-btn">Choose Photos</span>
            <span class="upload-area-label">or drag and drop here</span>
            <span class="upload-area-label">JPG &middot; PNG &middot; HEIC &middot; RAW</span>
        </div>

        <!-- Photo count -->
        <p class="photo-count" id="photo-count" style="display:none;"></p>

        <!-- Preview grid -->
        <div class="preview-grid" id="preview-grid"></div>

        <!-- Note -->
        <div class="note-label">
            <span>Note <span style="color: var(--text-muted); font-size:13px;">(optional)</span></span>
            <span class="note-char-count" id="note-char-count">0 / 500</span>
        </div>
        <textarea
            id="photo-note"
            placeholder="Add a note to go with your photos..."
            maxlength="500"
            oninput="updateCharCount()"
        ></textarea>

    </div>

    <div id="photos-submit-bar">
        <button id="photos-submit-btn" onclick="submitPhotos()" disabled>Upload Photos</button>
    </div>

</body>
</html>
