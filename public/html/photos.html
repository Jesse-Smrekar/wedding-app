<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/images/diamond-ring.svg">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="../scripts.js"></script>
    <script src="/scripts/photos.js"></script>
    <title>Jared & Tati</title>
</head>
<body>

    <a href="/" class="home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" stroke-width="10" class="bi bi-chevron-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
        </svg>
    </a>

    <div class="page-container">

        <header class="page-title">
            <h1 class="title">Photos</h1>
        </header>

        <p class="page-intro">Share photos with everyone or privately with the bride and groom. If you would like to see what others have shared, go to the </br>
            <b><a href="/photos/gallery" class="dancing-text" style="text-decoration: none;">
            <span>P</span>
            <span>h</span>
            <span>o</span>
            <span>t</span>
            <span>o</span>
            <span>&nbsp;</span>
            <span>G</span>
            <span>a</span>
            <span>l</span>
            <span>l</span>
            <span>e</span>
            <span>r</span>
            <span>y</span>
            </a></b>!
        </p>

        <!-- Hidden file input -->
        <div class="note-label">
            <span>Photos</span>
        </div>
        <input
            type="file"
            id="photo-input"
            accept=".jpg,.jpeg,.png,.heic,.heif,.raw,.arw,.cr2,.nef,.orf,.rw2,.sr2"
            multiple
            style="display:none;"
        >

        <button id="upload-area" class="btn btn-block" onclick="document.getElementById('photo-input').click()">Take / Select Photos</button>

        <!-- Photo count -->
        <p class="photo-count" id="photo-count" style="display:none;"></p>

        <!-- Preview grid -->
        <div class="preview-grid" id="preview-grid"></div>

        <!-- Note -->
        <div class="note-label">
            <span>Caption <span style="color: var(--text-muted); font-size:13px;">(optional)</span></span>
            <span class="note-char-count" id="note-char-count">0 / 500</span>
        </div>
        <textarea
            id="photo-note"
            class="field field-area"
            placeholder="Add a caption to go with your photos..."
            maxlength="500"
            oninput="updateCharCount()"
        ></textarea>

        <!-- Public slider -->
         <div class="note-label">
            <span>Visibility <span style="color: var(--text-muted); font-size:13px;">(optional)</span></span>
        </div>
        <div id="pub-slider" style="display:flex;align-items:center;margin-top:20px;">
            <label class="switch">
                <input id="public" type="checkbox">
                <span class="slider round"></span>
            </label>
            <span class="photo-count" style="margin:auto;margin-left:8px;">Make these public?</span>
        </div>
        <span class="photo-count">(others will be able to see your photos and caption)</span>


    </div>

    <div id="photos-submit-bar">
        <button id="photos-submit-btn" class="btn btn-block" onclick="submitPhotos()" disabled>Upload Photos</button>
    </div>

</body>
</html>
