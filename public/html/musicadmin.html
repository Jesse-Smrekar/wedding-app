<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/images/diamond-ring.svg">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="/scripts.js"></script>
    <script src="/scripts/musicadmin.js"></script>
    <title>Jared & Tati</title>
</head>
<body>
    <a href="/" class="home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
        </svg>
    </a>

    <header class="centered" style="padding-top:40px;">
        <h1 class="title">Music Admin</h1>
    </header>

    <div class="centered">
        <div id="home-grid">

            <!-- RE-AUTH SPOTIFY -->
            <a class="home-card" href="/musicadmin/spotify/login">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-spotify" viewBox="0 0 16 16">
					<path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288"/>
				</svg>
                <span>Re-auth Spotify</span>
            </a>

            <!-- QUEUE LIMIT TOGGLE -->
            <button class="home-card" onclick="toggleQueueLimit()">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M6 13c0 1.105-1.12 2-2.5 2S1 14.105 1 13s1.12-2 2.5-2 2.5.896 2.5 2m9-2c0 1.105-1.12 2-2.5 2s-2.5-.895-2.5-2 1.12-2 2.5-2 2.5.895 2.5 2"/>
                    <path fill-rule="evenodd" d="M14 11V2h1v9zM6 3v10H5V3z"/>
                    <path d="M5 2.905a1 1 0 0 1 .9-.995l8-.8a1 1 0 0 1 1.1.995V3L5 4z"/>
                </svg>
                <span>Queue Limit: <span id="queue-limit-state">…</span></span>
            </button>

            <!-- EXPLICIT TOGGLE -->
            <button class="home-card" onclick="toggleExplicit()">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M2.5 1A1.5 1.5 0 0 0 1 2.5v11A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 13.5 1zM6 4.5h4a.5.5 0 0 1 0 1H7.5V7H9a.5.5 0 0 1 0 1H7.5v2H10a.5.5 0 0 1 0 1H6.5a.5.5 0 0 1-.5-.5V5a.5.5 0 0 1 .5-.5z"/>
                </svg>
                <span>Explicit: <span id="explicit-state">…</span></span>
            </button>

            <!-- WAIT MINUTES INPUT -->
            <div class="home-card minutes-card">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/>
                    <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/>
                </svg>
                <input
                    id="queue-minutes"
                    class="minutes-input"
                    type="number"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    min="0"
                    step="1"
                    onkeydown="return blockNonNumericKeys(event)"
                    onchange="submitQueueMinutes(this.value)"
                />
                <span>min wait</span>
            </div>

        </div>
    </div>
</body>
</html>
