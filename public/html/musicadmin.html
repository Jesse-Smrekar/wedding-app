<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/images/diamond-ring.svg">
    <link rel="icon" type="image/png" href="/images/diamond-ring.png">
    <script src="/scripts.js"></script>
    <script src="/scripts/musicadmin.js"></script>
    <title>Jared & Tati</title>
</head>
<body>
    <a href="/" class="home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
        </svg>
    </a>

    <header class="centered" style="padding-top:40px;">
        <h1 class="title">Music Admin</h1>
    </header>

    <div class="centered">
        

        <!-- TOGGLE SLIDERS -->
        <div id="music-toggles" style="margin-top:20px;">
            <label class="toggle-row">
                <span class="toggle-label">Music Enabled</span>
                <span class="switch">
                    <input type="checkbox" id="music-enabled-toggle" onchange="toggleMusic()">
                    <span class="slider round"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-label">Queue Limit</span>
                <span class="switch">
                    <input type="checkbox" id="queue-limit-toggle" onchange="toggleQueueLimit()">
                    <span class="slider round"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-label">Queue Wait Time</span>
                <input
                    id="queue-minutes"
                    class="minutes-input"
                    type="number"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    min="0"
                    step="1"
                    onkeydown="return blockNonNumericKeys(event)"
                    onchange="submitQueueMinutes(this.value)"
                />
            </label>
            <label class="toggle-row">
                <span class="toggle-label">Explicit Allowed</span>
                <span class="switch">
                    <input type="checkbox" id="explicit-toggle" onchange="toggleExplicit()">
                    <span class="slider round"></span>
                </span>
            </label>
        </div>



        <div id="home-grid">

            <!-- RE-AUTH SPOTIFY -->
            <a class="home-card" href="/musicadmin/spotify/login">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-spotify" viewBox="0 0 16 16">
					<path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288"/>
				</svg>
                <span>Re-auth Spotify</span>
            </a>

            <!-- CLEAR QUEUE HISTORY -->
            <button class="home-card" onclick="clearQueueHistory()">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                    <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                </svg>
                <span>Clear Queue History</span>
            </button>

        </div>



    </div>
</body>
</html>
